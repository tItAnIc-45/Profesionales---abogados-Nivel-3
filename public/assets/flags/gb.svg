<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" role="img" aria-label="United Kingdom">
  <defs>
    <clipPath id="uk-clip">
      <rect width="60" height="30"/>
    </clipPath>
    <clipPath id="uk-diagonals">
      <path d="M30,0 L0,30 M30,0 L60,30 M0,0 L30,15 M60,0 L30,15 L0,15 M0,30 L30,15 L60,15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#uk-clip)">
    <rect width="60" height="30" fill="#012169"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4" clip-path="url(#uk-diagonals)"/>
    <path d="M30,0 L30,30 M0,15 L60,15" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M30,0 L30,30 M0,15 L60,15" stroke="#C8102E" stroke-width="6"/>
  </g>
</svg>
